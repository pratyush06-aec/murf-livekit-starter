<!doctype html>
<html lang="en">
  <head>
    <title>Disaster Earth</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
      }
      #container {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <!-- Import Map for Three.js WebGPU -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.173.0/build/three.webgpu.js",
          "three/webgpu": "https://unpkg.com/three@0.173.0/build/three.webgpu.js",
          "three/tsl": "https://unpkg.com/three@0.173.0/build/three.tsl.js",
          "three/addons/": "https://unpkg.com/three@0.173.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import {
        bumpMap,
        cameraPosition,
        color,
        max,
        mix,
        normalWorld,
        normalize,
        output,
        positionWorld,
        step,
        texture,
        uniform,
        uv,
        vec3,
        vec4,
      } from 'three/tsl';
      import * as THREE from 'three/webgpu';

      let camera, scene, renderer, controls, globe, effect;
      let time = 0;
      const clock = new THREE.Clock();
      const dummy = new THREE.Object3D();
      let hailParameters = [];
      let hailMaterials = [];

      // Colors for the disaster theme
      const DISASTER_RED = 0x9c0000;
      const DISASTER_ORANGE = 0xff3300;

      init();

      function init() {
        const container = document.getElementById('container');

        // CAMERA
        camera = new THREE.PerspectiveCamera(25, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2.5, 1.0, 1.6);

        // SCENE
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050000); // Very dark red

        // LIGHTS FOR EARTH
        const sun = new THREE.DirectionalLight('#ffffff', 2);
        sun.position.set(0, 0, 3);
        scene.add(sun);

        // LIGHTS FOR MARCHING CUBES (Rain)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(0.5, 0.5, 1);
        scene.add(light);

        const pointLight = new THREE.PointLight(DISASTER_ORANGE, 3, 0, 0);
        pointLight.position.set(0, 0, 10);
        scene.add(pointLight);

        const ambientLight = new THREE.AmbientLight(0x321111, 2); // reddish ambient
        scene.add(ambientLight);

        // ==========================================
        // 1. EARTH GLOBE LOGIC
        // ==========================================
        const atmosphereDayColor = uniform(color('#ff4d4d')); // Reddish atmosphere for disaster
        const atmosphereTwilightColor = uniform(color('#bc0b0b'));
        const roughnessLow = uniform(0.25);
        const roughnessHigh = uniform(0.35);

        const textureLoader = new THREE.TextureLoader();
        const dayTexture = textureLoader.load(
          'https://threejs.org/examples/textures/planets/earth_day_4096.jpg'
        );
        dayTexture.colorSpace = THREE.SRGBColorSpace;
        dayTexture.anisotropy = 8;

        const nightTexture = textureLoader.load(
          'https://threejs.org/examples/textures/planets/earth_night_4096.jpg'
        );
        nightTexture.colorSpace = THREE.SRGBColorSpace;
        nightTexture.anisotropy = 8;

        const bumpRoughnessCloudsTexture = textureLoader.load(
          'https://threejs.org/examples/textures/planets/earth_bump_roughness_clouds_4096.jpg'
        );
        bumpRoughnessCloudsTexture.anisotropy = 8;

        const viewDirection = positionWorld.sub(cameraPosition).normalize();
        const fresnel = viewDirection.dot(normalWorld).abs().oneMinus().toVar();
        const sunOrientation = normalWorld.dot(normalize(sun.position)).toVar();
        const atmosphereColor = mix(
          atmosphereTwilightColor,
          atmosphereDayColor,
          sunOrientation.smoothstep(-0.25, 0.75)
        );

        const globeMaterial = new THREE.MeshStandardNodeMaterial();
        const cloudsStrength = texture(bumpRoughnessCloudsTexture, uv()).b.smoothstep(0.2, 1);

        // Mix day texture with reddish clouds
        globeMaterial.colorNode = mix(
          texture(dayTexture),
          vec3(1, 0.5, 0.5),
          cloudsStrength.mul(2)
        );

        const roughness = max(texture(bumpRoughnessCloudsTexture).g, step(0.01, cloudsStrength));
        globeMaterial.roughnessNode = roughness.remap(0, 1, roughnessLow, roughnessHigh);

        const night = texture(nightTexture);
        const dayStrength = sunOrientation.smoothstep(-0.25, 0.5);
        const atmosphereDayStrength = sunOrientation.smoothstep(-0.5, 1);
        const atmosphereMix = atmosphereDayStrength.mul(fresnel.pow(2)).clamp(0, 1);

        let finalOutput = mix(night.rgb, output.rgb, dayStrength);
        finalOutput = mix(finalOutput, atmosphereColor, atmosphereMix);

        globeMaterial.outputNode = vec4(finalOutput, output.a);

        const bumpElevation = max(texture(bumpRoughnessCloudsTexture).r, cloudsStrength);
        globeMaterial.normalNode = bumpMap(bumpElevation);

        const sphereGeometry = new THREE.SphereGeometry(1, 64, 64);
        globe = new THREE.Mesh(sphereGeometry, globeMaterial);
        scene.add(globe);

        // ATMOSPHERE
        const atmosphereMaterial = new THREE.MeshBasicNodeMaterial({
          side: THREE.BackSide,
          transparent: true,
        });
        let alpha = fresnel.remap(0.73, 1, 1, 0).pow(3);
        alpha = alpha.mul(sunOrientation.smoothstep(-0.5, 1));
        atmosphereMaterial.outputNode = vec4(atmosphereColor, alpha);

        const atmosphere = new THREE.Mesh(sphereGeometry, atmosphereMaterial);
        atmosphere.scale.setScalar(1.04);
        scene.add(atmosphere);

        // ==========================================
        // 2. RAIN (Water Particles)
        // ==========================================
        const rainGeometry = new THREE.SphereGeometry(0.01, 8, 8);

        // Water material for the raindrops
        const rainMaterial = new THREE.MeshStandardMaterial({
          color: 0x88ccff,
          emissive: 0x112233,
          roughness: 0.05,
          metalness: 1.0,
          transparent: true,
          opacity: 0.4,
        });

        // 300 droplets across the screen
        effect = new THREE.InstancedMesh(rainGeometry, rainMaterial, 300);
        scene.add(effect);

        // ==========================================
        // 3. HAIL STORM BACKGROUND
        // ==========================================
        const stormGeometry = new THREE.BufferGeometry();
        const stormVertices = [];

        // Procedural circular texture for hail (avoids CORS and UV issues)
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.5, 'rgba(255,255,255,0.5)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 64, 64);
        const hailTexture = new THREE.CanvasTexture(canvas);
        hailTexture.colorSpace = THREE.SRGBColorSpace;

        // Spread hail across a large 40x40x40 bounding box to surround the globe and camera
        for (let i = 0; i < 10000; i++) {
          const x = Math.random() * 40 - 20;
          const y = Math.random() * 40 - 20;
          const z = Math.random() * 40 - 20;
          stormVertices.push(x, y, z);
        }

        stormGeometry.setAttribute('position', new THREE.Float32BufferAttribute(stormVertices, 3));

        // Icy blue colors for the hail (increased size, no texture map to avoid WebGPU uv bug on points)
        hailParameters = [
          [[0.6, 0.2, 0.8], 0.5],
          [[0.55, 0.1, 0.7], 0.4],
          [[0.65, 0.05, 0.9], 0.3],
          [[0.5, 0.0, 1.0], 0.2],
          [[0.58, 0.0, 0.9], 0.15],
        ];

        for (let i = 0; i < hailParameters.length; i++) {
          const color = hailParameters[i][0];
          const size = hailParameters[i][1];

          const mat = new THREE.PointsMaterial({
            size: size,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
          });
          mat.color.setHSL(color[0], color[1], color[2], THREE.SRGBColorSpace);
          hailMaterials[i] = mat;

          const particles = new THREE.Points(stormGeometry, mat);

          particles.rotation.x = Math.random() * 6;
          particles.rotation.y = Math.random() * 6;
          particles.rotation.z = Math.random() * 6;

          particles.name = 'hailParticles_' + i;

          scene.add(particles);
        }

        // RENDERER
        renderer = new THREE.WebGPURenderer({ forceWebGL: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setAnimationLoop(animate);
        container.appendChild(renderer.domElement);

        // CONTROLS
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = true; // User requested zoom
        controls.enablePan = false;
        // Current distance is ~3.13, fix as max size (closest zoom)
        controls.minDistance = 3.13;
        // Min size to fit entire globe vertically (furthest zoom)
        controls.maxDistance = 4.65;
        controls.autoRotate = false;

        window.addEventListener('resize', onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function updateRain(object, time, numdrops) {
        for (let i = 0; i < numdrops; i++) {
          const speed = time * (1.5 + (i % 5) * 0.5); // Fall faster

          // Spread across the visible screen (x from -1.5 to 1.5, z from -1.5 to 1.5)
          const startX = Math.sin(i * 123.456) * 1.5;
          const startZ = Math.cos(i * 987.654) * 1.5;

          // Y wraps around -1.5 to 1.5 to fall from top to bottom
          const yDrop = 1.5 - ((speed + i * 0.1) % 3.0);

          dummy.position.set(startX, yDrop, startZ);

          // Elongate significantly to look like fast falling rain streaks
          dummy.scale.set(1, 5, 1);
          dummy.updateMatrix();

          object.setMatrixAt(i, dummy.matrix);
        }
        object.instanceMatrix.needsUpdate = true;
      }

      async function animate() {
        const delta = clock.getDelta();
        time += delta * 0.5;

        // Rotate the globe
        globe.rotation.y += delta * 0.05;

        // Update rain drops (tiny particles)
        updateRain(effect, time, 300);

        // Animate Hail Storm
        const stormTime = Date.now() * 0.00005;
        for (let i = 0; i < hailParameters.length; i++) {
          const object = scene.getObjectByName('hailParticles_' + i);
          if (object) {
            object.rotation.y = stormTime * (i < 4 ? i + 1 : -(i + 1));
          }
          const color = hailParameters[i][0];
          const h = ((360 * (color[0] + stormTime)) % 360) / 360;
          hailMaterials[i].color.setHSL(h, color[1], color[2], THREE.SRGBColorSpace);
        }

        controls.update();
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
